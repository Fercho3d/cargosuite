<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frego — comparación en vivo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0d0f;color:#ededf0;font:16px/1.4 system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 24px;border-bottom:1px solid #26272b;display:flex;align-items:baseline;gap:16px;flex:none}
  h1{font-size:20px;font-weight:700}
  header p{color:#83868f;font-size:14px}
  .cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;min-height:0}
  .col{display:flex;flex-direction:column;border:1px solid #26272b;border-radius:12px;overflow:hidden;min-height:0}
  .head{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
  .viejo .head{background:#7f1d1d}
  .nuevo .head{background:#065f46}
  .nombre{font-weight:700;font-size:17px}
  .sub{font-size:12px;opacity:.8}
  .reloj{font:800 40px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .marco{flex:1;position:relative;background:#fff;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block}
  .espera{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f4f4f5;color:#52525b;font-size:15px}
  .barra{width:200px;height:4px;background:#d4d4d8;border-radius:2px;overflow:hidden}
  .barra i{display:block;height:100%;width:40%;background:#a1a1aa;animation:v 1.1s ease-in-out infinite}
  @keyframes v{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .listo{background:#fff}
  footer{padding:10px 24px;border-top:1px solid #26272b;color:#63656e;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none}
  .veces{color:#f04452;font-weight:700}
  #btn{background:#e11d2a;color:#fff;border:0;border-radius:8px;padding:8px 18px;font:600 13px system-ui,sans-serif;cursor:pointer}
  #btn:hover{background:#c11020}
  #btn:disabled{opacity:.45;cursor:default}
  .cuenta{position:fixed;inset:0;z-index:50;background:rgba(12,13,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .cuenta b{font-size:80px;font-weight:800}
  .cuenta span{color:#83868f;font-size:17px}
</style>
</head>
<body>
<header>
  <h1>Mismo booking · mismo servidor · misma base de datos</h1>
  <p id="ctx">Transacciones del booking R1676A13271//167CA00667 — 19 registros</p>
</header>

<div class="cols">
  <div class="col viejo">
    <div class="head">
      <div><div class="nombre">Sistema actual</div><div class="sub">Yii2 · puerto 80</div></div>
      <div class="reloj" id="rv">0.0 s</div>
    </div>
    <div class="marco">
      <div class="espera" id="ev"><div>Cargando…</div><div class="barra"><i></i></div></div>
      <iframe id="fv"></iframe>
    </div>
  </div>

  <div class="col nuevo">
    <div class="head">
      <div><div class="nombre">Sistema nuevo</div><div class="sub">Laravel · puerto 9000</div></div>
      <div class="reloj" id="rn">0.0 s</div>
    </div>
    <div class="marco">
      <div class="espera" id="en"><div>Cargando…</div><div class="barra"><i></i></div></div>
      <iframe id="fn"></iframe>
    </div>
  </div>
</div>

<footer>
  <span id="pie">Listo para iniciar</span>
  <button id="btn" onclick="iniciar()">Repetir comparación</button>
  <span id="dif"></span>
</footer>

<script>
const VIEJO = 'http://52.12.171.198/web/transaction?booking=2237';
const NUEVO = 'http://52.12.171.198:9000/transacciones/booking/2237';
let t0, tv = null, tn = null, timer;

function pinta(el, ms){ el.textContent = (ms/1000).toFixed(1) + ' s'; }

function tick(){
  const ms = performance.now() - t0;
  if (tv === null) pinta(rv, ms);
  if (tn === null) pinta(rn, ms);
  if (tv !== null && tn !== null){
    clearInterval(timer);
    btn.disabled = false;
    const veces = (tv / tn).toFixed(0);
    dif.innerHTML = 'El nuevo cargó <span class="veces">' + veces + ' veces</span> más rápido';
    pie.textContent = 'Terminado — ' + (tv/1000).toFixed(1) + ' s contra ' + (tn/1000).toFixed(1) + ' s';
  }
}

function iniciar(){
  btn.disabled = true;
  tv = tn = null;
  ev.style.display = en.style.display = 'flex';
  dif.textContent = '';
  pie.textContent = 'Cargando las dos al mismo tiempo…';

  fv.onload = () => { if (tv === null){ tv = performance.now() - t0; pinta(rv, tv); ev.style.display='none'; } };
  fn.onload = () => { if (tn === null){ tn = performance.now() - t0; pinta(rn, tn); en.style.display='none'; } };

  t0 = performance.now();
  fv.src = VIEJO;
  fn.src = NUEVO;
  clearInterval(timer);
  timer = setInterval(tick, 50);
}
window.iniciar = iniciar;

// Cuenta regresiva al abrir, para que una grabación de pantalla capture todo
// desde el principio sin que nadie tenga que apretar nada.
(function(){
  const capa = document.createElement('div');
  capa.className = 'cuenta';
  capa.innerHTML = '<b id="n">3</b><span>Cargando las dos pantallas al mismo tiempo…</span>';
  document.body.appendChild(capa);
  let n = 3;
  const t = setInterval(() => {
    n--;
    if (n > 0) { document.getElementById('n').textContent = n; return; }
    clearInterval(t);
    capa.remove();
    iniciar();
  }, 900);
})();
</script>
</body>
</html>
